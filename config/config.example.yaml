# Claude Box 配置示例（apiVersion: claude-box/v1alpha1）
# 复制为 config.yaml 后按需修改。勿把含真实代理口令的文件提交进仓库。

apiVersion: claude-box/v1alpha1
kind: Box

metadata:
  name: default

spec:
  vm:
    name: ClaudeBox-Win
    memory_mb: 8192
    cpus: 4
    generation: 2
    # 空则由控件按约定目录生成，例如 %LOCALAPPDATA%\ClaudeBox\disks\...
    vhd_path: ""
    switch_name: ClaudeBox-Internal

  gateway:
    # 双配时优先使用 primary
    primary: http
    http: "http://127.0.0.1:7890"
    socks5: "socks5://127.0.0.1:7891"
    # Internal 网上网关（宿主机 vEthernet）地址与网段
    listen_ip: "192.168.87.1"
    subnet: "192.168.87.0/24"

  visible_dirs:
    - host_path: "C:\\Users\\Public\\ClaudeBoxShare\\project"
      read_only: false

  identity:
    hostname: claude-box
    timezone: UTC
    locale: en-US

  features:
    # true 时控件应警告：环境伪装（时区等）基本不可靠
    full_disk: false
