# Claude Box · WSL2 轨配置示例
# 复制为 wsl-box.yaml 后修改。勿提交含真实代理口令的文件。

apiVersion: claude-box/wsl/v1alpha1
kind: WslBox

metadata:
  name: default
  distro_name: ClaudeBox

spec:
  # 基座：已有 Ubuntu 可 export/import 改名；或 wsl --install 后再 import
  base:
    preferred_source: Ubuntu-24.04
    install_dir: ""   # 空 = %LOCALAPPDATA%\ClaudeBox\wsl\ClaudeBox

  gateway:
    # WSL 内访问宿主机：脚本会解析默认网关 IP；也可手写
    host: auto
    http_port: 3080
    # 上游常为 Clash；由宿主 ClaudeBox.Gateway / gost 转发
    upstream_http: "http://127.0.0.1:7890"
    upstream_socks5: "socks5://127.0.0.1:7891"
    blocklist:
      - ingest.us.sentry.io
      - browser-intake-datadoghq.com
      - browser-intake-us5-datadoghq.com
    logging:
      enabled: true
      path: ""   # 空 = %LOCALAPPDATA%\ClaudeBox\logs\wsl-gateway.jsonl

  # 只挂这些宿主目录；禁止写 C:\ 根或整棵 Users
  visible_dirs:
    - host_path: "D:\\Projects\\demo"
      guest_path: "/mnt/claude-box/demo"
      read_only: false

  mount:
    disable_automount: true   # /etc/wsl.conf automount.enabled=false

  identity:
    timezone: America/Los_Angeles
    locale: en_US.UTF-8
    language: en_US
    hostname: claude-box
    # 可选 Electron 参数
    electron_lang: en-US

  # 身份展示（SCOPE v0.4.0）：部署后采集，设置页按字段选择
  # 原样展示 / 隐藏 / 修改后展示。默认厂商与型号可展示，硬件编码默认隐藏。
  # 见 docs/identity-presentation.md。
  # 下列 hide_identifiers 是 P1 策略引擎接上之前的过渡硬开关：
  # 必须为 true，关闭则现行 apply/verify 失败。
  # 真机完整采集由 P2 写入盒子内原始清单，不要把真实编码填进本文件。
  # 时区/语言仍只在盒子内伪装。本段不是为了隐藏 WSL / 虚拟机特征。
  host_identity:
    expose_real_model: true
    manufacturer: ""
    product: ""
    # 过渡硬开关：必须为 true。关闭则现行 apply/verify 失败。
    hide_identifiers: true
    hidden_identifier_keys:
      - serial
      - serial_number
      - chassis_uuid
      - board_uuid
      - product_uuid
      - mac
      - mac_address
      - disk_serial
      - cpu_id
      - processor_id
      - machine_guid
      - device_instance_path

  desktop:
    # 安装脚本下载 URL 或本地 deb 路径（宿主路径，启动前拷进发行版）
    deb_url: ""
    deb_local: ""
    # 启动二进制名（随官方包调整）
    command: "claude-desktop"
    extra_args: []
    # 备用：asar 补丁（默认关）
    asar_patch: false

  features:
    exclude_host_system_drive: true
    computer_use: false
    # 可选 · 已知有效 · 默认关：宿主本机 IP 集合变化时，礼貌关→强杀 box 内全部 Claude
    # 学 claude-switcher；不替代唯一网关。见 docs/kill-on-local-ip-change.md
    kill_on_local_ip_change: false
    # kill_grace_seconds: 10
    # watch_interval_seconds: 5
    # Claude 跳转 OAuth / 授权页时，用独立伴生指纹浏览器打开，不走宿主默认浏览器。
    # 参考 CCBaga 仅此一条；意图默认开。未接线 / 引擎未就绪时必须拒绝打开，禁止回退宿主浏览器。
    # 见 docs/companion-fingerprint-browser.md
    oauth_open_in_fingerprint_browser: true
    # 盒子内身份保险库（学 CCBaga）；只写发行版 / ClaudeBox 专属目录，尽量不改宿主。
    # 见 docs/identity-vault.md
    identity_vault: true
